<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samarth Business | Loading...</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Smart Session Router
        const session = localStorage.getItem("samarth_user_session");
        if (session) {
            window.location.replace("dashboard.html");
        } else {
            window.location.replace("login.html");
        }
    </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc;">
    <div style="text-align: center; padding: 2rem;">
        <div style="width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem;"></div>
        <h2 style="color: #0f172a; margin-bottom: 0.5rem;">Loading Samarth Business...</h2>
        <p style="color: #64748b;">Redirecting to your portal...</p>
        <noscript>
            <p style="margin-top: 1rem;"><a href="login.html" style="color: #2563eb; font-weight: bold;">Click here to continue to Login</a></p>
        </noscript>
    </div>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</body>
</html>
